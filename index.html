<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080711">
<title>QX Wallet Test</title>

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
padding:0;
min-height:100%;
background:#070510;
color:white;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.box{
width:100%;
max-width:430px;
background:#120b21;
border:1px solid #5d3b91;
border-radius:24px;
padding:28px 20px;
text-align:center;
box-shadow:0 20px 70px rgba(0,0,0,.5);
}

.logo{
font-size:42px;
font-weight:900;
letter-spacing:-3px;
margin-bottom:10px;
}

.logo span{
color:#a970ff;
}

h1{
font-size:25px;
margin:10px 0;
}

p{
color:#a99db8;
font-size:13px;
line-height:1.6;
}

button{
width:100%;
height:58px;
border:0;
border-radius:16px;
background:linear-gradient(135deg,#9b61ff,#6436c4);
color:white;
font-size:15px;
font-weight:900;
margin-top:15px;
cursor:pointer;
}

button:disabled{
opacity:.55;
}

.status{
margin-top:18px;
padding:14px;
border-radius:14px;
background:#090611;
border:1px solid rgba(169,112,255,.25);
color:#aaa;
font-size:12px;
line-height:1.6;
word-break:break-word;
}

.status.ok{
color:#48e09b;
border-color:rgba(72,224,155,.3);
}

.status.err{
color:#ff667d;
border-color:rgba(255,102,125,.3);
}

.address{
display:none;
margin-top:12px;
padding:14px;
background:rgba(72,224,155,.07);
border:1px solid rgba(72,224,155,.25);
border-radius:14px;
font-size:11px;
word-break:break-all;
}

.address.show{
display:block;
}

.small{
margin-top:20px;
font-size:10px;
color:#70647e;
}
</style>
</head>

<body>

<div class="box">

<div class="logo">
q<span>x</span>
</div>

<h1>QX Wallet Connection</h1>

<p>
Solana wallet connection test.
<br>
Safari → Wallet Selector → Solana Wallet
</p>

<button id="connect">
CONNECT WALLET
</button>

<div id="status" class="status">
Ready. Tap CONNECT WALLET.
</div>

<div id="address" class="address"></div>

<div class="small">
QX Exchange
</div>

</div>


<script type="module">

const PROJECT_ID =
"bd6faec63fbd0865f57da576a550ef09";

const connectButton =
document.getElementById("connect");

const statusBox =
document.getElementById("status");

const addressBox =
document.getElementById("address");


function status(text,type=""){
statusBox.textContent=text;
statusBox.className="status "+type;
}


function showAddress(address){
addressBox.textContent=
"Connected:\n"+address;

addressBox.classList.add("show");

connectButton.textContent=
"WALLET CONNECTED";

connectButton.disabled=true;

status(
"Solana wallet connected successfully.",
"ok"
);
}


/*
=========================================================
DIRECT INJECTED WALLET
=========================================================
*/

async function tryInjected(){

const wallets=[];


/*
Phantom
*/

if(
window.phantom &&
window.phantom.solana
){

wallets.push({
name:"Phantom",
provider:window.phantom.solana
});

}


/*
Solflare
*/

if(
window.solflare
){

wallets.push({
name:"Solflare",
provider:window.solflare
});

}


/*
Backpack
*/

if(
window.backpack &&
window.backpack.solana
){

wallets.push({
name:"Backpack",
provider:window.backpack.solana
});

}


if(wallets.length===0){

return false;

}


for(
const wallet of wallets
){

try{

status(
"Connecting to "+wallet.name+"..."
);

const result =
await wallet.provider.connect();


let address=null;


if(
result &&
result.publicKey
){

address=
result.publicKey.toString();

}


if(
!address &&
wallet.provider.publicKey
){

address=
wallet.provider.publicKey.toString();

}


if(address){

showAddress(address);

window.qxWalletProvider=
wallet.provider;

window.qxWalletAddress=
address;

return true;

}

}catch(error){

console.log(
wallet.name,
error
);

}

}


return false;

}


/*
=========================================================
REOWN APPKIT
=========================================================
*/

async function tryReown(){

status(
"Loading QX wallet selector..."
);

try{

/*
Load only the two required packages.
No Buffer.
No wallet-adapter-wallets.
No dynamic dependency chain.
*/

const appkitModule =
await import(
"https://esm.sh/@reown/appkit@latest"
);

const solanaAdapterModule =
await import(
"https://esm.sh/@reown/appkit-adapter-solana@latest"
);

const networksModule =
await import(
"https://esm.sh/@reown/appkit@latest/networks"
);


const createAppKit =
appkitModule.createAppKit;

const SolanaAdapter =
solanaAdapterModule.SolanaAdapter;

const solana =
networksModule.solana;


if(
typeof createAppKit!=="function"
){

throw new Error(
"Reown createAppKit unavailable"
);

}


if(
typeof SolanaAdapter!=="function"
){

throw new Error(
"Reown SolanaAdapter unavailable"
);

}


const adapter =
new SolanaAdapter();


const metadata={

name:"QX Presale",

description:"QX Exchange",

url:
"https://jhsmj5d6tc-cmd.github.io/qx-exchange/",

icons:[]

};


const modal =
createAppKit({

adapters:[
adapter
],

networks:[
solana
],

projectId:
PROJECT_ID,

metadata:
metadata,

themeMode:
"dark",

features:{
analytics:false,
email:false,
socials:false
}

});


if(!modal){

throw new Error(
"Reown AppKit returned no modal"
);

}


/*
Open the Solana connection modal.
*/

await modal.open({
view:"Connect",
namespace:"solana"
});


status(
"Wallet selector opened. Choose your Solana wallet."
);


/*
Wait for account.
*/

for(
let i=0;
i<120;
i++
){

await new Promise(
resolve=>
setTimeout(resolve,500)
);


try{

let account=null;


if(
typeof modal.getAccount==="function"
){

account=
modal.getAccount();

}


if(
account
){

let address=
account.address ||
account.caipAddress ||
account.publicKey;


if(
typeof address==="string" &&
address.length>20
){

showAddress(address);

try{

window.qxWalletProvider=
await modal.getWalletProvider();

}catch(_){}

window.qxWalletAddress=
address;

return true;

}

}

}catch(_){}

}


throw new Error(
"Wallet selector opened but no wallet was connected."
);


}catch(error){

console.error(
"REOWN ERROR:",
error
);

throw error;

}

}


/*
=========================================================
MAIN CONNECT
=========================================================
*/

async function connect(){

connectButton.disabled=true;

addressBox.classList.remove("show");

status(
"Starting wallet connection..."
);


try{

/*
First try injected wallet.
This works when the page is opened
inside Phantom/Solflare/Backpack.
*/

const injected =
await tryInjected();

if(injected){

return;

}


/*
If Safari is outside a wallet,
open Reown wallet selector.
*/

await tryReown();


}catch(error){

console.error(
"FINAL WALLET ERROR:",
error
);

status(
"Connection failed: "+
(
error &&
error.message
?
error.message
:
"Unknown error"
),
"err"
);

connectButton.disabled=false;

}

}


/*
=========================================================
BUTTON
=========================================================
*/

connectButton.addEventListener(
"click",
connect,
{
passive:false
});


/*
=========================================================
PAGE READY
=========================================================
*/

status(
"Ready. Tap CONNECT WALLET."
);

</script>

</body>
</html>
